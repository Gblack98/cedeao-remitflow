version: 2

models:
  - name: fct_transferts_cedeao
    description: Table de faits, grain = un transfert individuel.
    columns:
      - name: transfert_id
        tests: [not_null, unique]
      - name: devise_cible
        tests:
          - relationships:
              to: ref('dim_devises')
              field: code_devise
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_temps')
              field: date_id
      - name: pays_cible
        tests:
          - relationships:
              to: ref('dim_corridor')
              field: pays
      - name: canal
        tests:
          - relationships:
              to: ref('dim_canaux')
              field: canal
      - name: statut
        tests:
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'PENDING']

  - name: dim_devises
    columns:
      - name: code_devise
        tests: [not_null, unique]

  - name: dim_corridor
    columns:
      - name: pays
        tests: [not_null, unique]

  - name: dim_canaux
    columns:
      - name: canal
        tests: [not_null, unique]

  - name: dim_temps
    description: Date spine, une ligne par jour calendaire.
    columns:
      - name: date_id
        tests: [not_null, unique]

  - name: obt_transferts
    description: >
      Table dénormalisée alimentant le dashboard. Grain identique à la
      table de faits, dimensions aplaties et mesures dérivées incluses.
    columns:
      - name: transfert_id
        tests: [not_null, unique]
      - name: type_corridor
        tests:
          - accepted_values:
              values: ['Sans risque de change', 'Avec risque de change']
      - name: zone_cible
        tests:
          - not_null
          - accepted_values:
              values: ['UEMOA', 'ZMAO']
