version: 2

models:
  - name: fct_transferts_cedeao
    description: Table de faits, grain = un transfert individuel.
    columns:
      - name: transfert_id
        tests: [not_null, unique]
      - name: devise_cible
        tests:
          - relationships:
              to: ref('dim_devises')
              field: code_devise
      - name: date_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_temps')
              field: date_id
      - name: pays_cible
        tests:
          - relationships:
              to: ref('dim_corridor')
              field: pays
      - name: canal
        tests:
          - relationships:
              to: ref('dim_canaux')
              field: canal
      - name: statut
        tests:
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'PENDING']

  - name: dim_devises
    columns:
      - name: code_devise
        tests: [not_null, unique]

  - name: dim_corridor
    columns:
      - name: pays
        tests: [not_null, unique]

  - name: dim_canaux
    columns:
      - name: canal
        tests: [not_null, unique]

  - name: dim_temps
    description: Date spine, une ligne par jour calendaire.
    columns:
      - name: date_id
        tests: [not_null, unique]

  - name: obt_transferts
    description: >
      Table dénormalisée alimentant le dashboard. Grain identique à la
      table de faits, dimensions aplaties et mesures dérivées incluses.
    columns:
      - name: transfert_id
        tests: [not_null, unique]
      - name: type_corridor
        tests:
          - accepted_values:
              values: ['Sans risque de change', 'Avec risque de change']
      - name: zone_cible
        tests:
          - not_null
          - accepted_values:
              values: ['UEMOA', 'ZMAO']

  - name: agg_kpi_global
    description: Indicateurs de tête, une seule ligne, pour les cartes de score.

  - name: agg_corridors
    description: Volume et valeur par corridor émetteur/récepteur.
    columns:
      - name: pays_source
        tests: [not_null]
      - name: transferts
        tests: [not_null]

  - name: agg_taux_journalier
    description: Série temporelle des taux, avec indice base 100 par devise.
    columns:
      - name: date_id
        tests: [not_null]
      - name: taux
        tests: [not_null]

  - name: agg_impact_change
    description: >
      Montant reçu pour 100 000 XOF nets envoyés, du pire au meilleur
      jour, par type de corridor et devise.
    columns:
      - name: devise_cible
        tests: [not_null, unique]

  - name: agg_couts_canal
    description: Coût de commission moyen par canal et type de corridor.
    columns:
      - name: canal
        tests: [not_null]
